[project]
name = "internship-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "dateparser>=1.5.1",
    "email-validator>=2.4.0",
    "extruct>=0.18.0",
    "fastapi>=0.165.0",
    "feedparser>=6.0.14",
    "ftfy>=6.3.1",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "orjson>=3.13.0",
    "playwright>=1.65.2",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "python-dateutil>=4.0.0",
    "rapidfuzz>=3.14.6",
    "regex>=2026.11.19",
    "scrapy>=2.20.0",
    "selectolax>=1.0.2",
    "sqlalchemy>=2.1.9",
    "tenacity>=9.2.1",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
ai = [
    "ollama>=0.6.3",
    "sentence-transformers>=6.3.0",
]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
]
phase2 = [
    "arq>=0.28.0",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "redis>=5.3.1",
]
